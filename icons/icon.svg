<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>WageTicker</title>
  <rect width="512" height="512" rx="112" fill="#1C222E"/>
  <!-- 進み続けるゲージ(お金の記号は使わない)。トラックの上に、伸びていく弧を重ねる。 -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#2B3342" stroke-width="34"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#8FD0EA" stroke-width="34"
          stroke-linecap="round" stroke-dasharray="706.86 942.48"
          transform="rotate(-90 256 256)"/>
  <!-- 弧の先端の粒。まだ増え続けている、という合図。 -->
  <circle cx="106" cy="256" r="27" fill="#F0C98A"/>
</svg>
