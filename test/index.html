<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WageTicker — 計算ロジックのテスト</title>
<style>
  body { background:#0a0e0c; color:#d9e6de; font-family: system-ui, sans-serif; margin:0; padding:20px; }
  h1 { font-size:16px; margin:0 0 4px; }
  .summary { font-family: ui-monospace, monospace; font-size:14px; margin:12px 0 18px; padding:10px 12px; border-radius:10px; border:1px solid #1f2a24; }
  .summary.pass { color:#48e39b; border-color:rgba(72,227,155,.4); }
  .summary.fail { color:#e08a7a; border-color:rgba(224,138,122,.4); }
  ul { list-style:none; padding:0; margin:0; max-width:900px; }
  li { padding:7px 10px; border-bottom:1px solid #141c18; font-size:13px; display:flex; gap:10px; align-items:flex-start; }
  .mark { font-family: ui-monospace, monospace; }
  li.ok .mark { color:#48e39b; }
  li.ng .mark { color:#e08a7a; }
  .msg { display:block; color:#e08a7a; font-family: ui-monospace, monospace; font-size:12px; margin-top:4px; }
  p.hint { color:#6d7f76; font-size:12px; }
</style>
</head>
<body>
<h1>WageTicker — 計算ロジックのテスト</h1>
<p class="hint">給与計算の純粋関数(SPEC 3〜8章)を検証します。このファイルを直接開くだけで実行されます。</p>
<div class="summary" id="summary">実行中…</div>
<ul id="list"></ul>

<script src="../src/constants.js"></script>
<script src="../src/time.js"></script>
<script src="../src/period.js"></script>
<script src="../src/wage.js"></script>
<script src="../src/aggregate.js"></script>
<script src="../src/storage.js"></script>
<script src="tests.js"></script>
<script>
(function () {
  var r = WT.tests.run();
  var sum = document.getElementById('summary');
  sum.textContent = r.passed + ' / ' + r.total + ' passed' + (r.passed === r.total ? '  ✔' : '  ✘');
  sum.className = 'summary ' + (r.passed === r.total ? 'pass' : 'fail');
  var list = document.getElementById('list');
  var html = '';
  for (var i = 0; i < r.results.length; i++) {
    var t = r.results[i];
    html += '<li class="' + (t.ok ? 'ok' : 'ng') + '"><span class="mark">' + (t.ok ? 'PASS' : 'FAIL') +
      '</span><span>' + t.name + (t.ok ? '' : '<span class="msg">' + t.message + '</span>') + '</span></li>';
  }
  list.innerHTML = html;
  console.log('[wage-ticker tests] ' + r.passed + '/' + r.total + ' passed');
  for (var j = 0; j < r.results.length; j++) {
    if (!r.results[j].ok) console.error('FAIL: ' + r.results[j].name + ' — ' + r.results[j].message);
  }
})();
</script>
</body>
</html>
